name: Feature request
description: Propose a new capability or improvement to prollm.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem first, then your proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? What's the user-facing pain point?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should prollm do? Include API sketch if applicable.
      render: python
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why you ruled them out.

  - type: dropdown
    id: scope
    attributes:
      label: Affected provider
      options:
        - anthropic
        - gemini
        - openai
        - cross-cutting (all providers)
        - tooling / CI
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links to provider docs, related issues, prior art in other SDKs.
