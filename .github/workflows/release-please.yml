name: Release Please

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

env:
  # Opt into Node 24 ahead of the 2026-06-02 forced switch; remove after that.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout release PR branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}

      - name: Set up uv
        if: ${{ steps.release.outputs.pr }}
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync uv.lock to bumped version
        if: ${{ steps.release.outputs.pr }}
        env:
          PR_BRANCH: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already in sync; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv.lock to bumped version"
          git push origin "HEAD:$PR_BRANCH"
