[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prollm"]

[tool.hatch.build.targets.sdist]
include = [
    "/prollm",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[project]
name = "prollm"
version = "0.1.0"
description = "Unified SDK for multiple LLM providers (OpenAI, Anthropic, Gemini)"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Andrei Mukhametvaleev", email = "andrei.mukhametvaleev@gmail.com" },
]
maintainers = [
    { name = "Andrei Mukhametvaleev", email = "andrei.mukhametvaleev@gmail.com" },
]
keywords = ["llm", "ai", "openai", "anthropic", "gemini", "sdk", "gpt", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/Mukhametvaleev/prollm"
Documentation = "https://mukhametvaleev.github.io/prollm/"
Repository = "https://github.com/Mukhametvaleev/prollm"
Issues = "https://github.com/Mukhametvaleev/prollm/issues"
Changelog = "https://github.com/Mukhametvaleev/prollm/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-section-index>=0.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = [
    "ANN401",
    "COM812",
    "D203",
    "D213",
    "EM101",
    "EM102",
    "ISC001",
    "TC001",
    "TC002",
    "TC003",
    "TRY003",
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN201",
    "D",
    "PLR2004",
    "S101",
    "S105",
    "S106",
    "SLF001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
disallow_untyped_decorators = false
python_version = "3.14"
strict = true

[tool.pydoclint]
style = "google"
exclude = '\.venv|tests/|site/|htmlcov/'
arg-type-hints-in-docstring = false
arg-type-hints-in-signature = true
check-arg-order = true
check-class-attributes = false
check-return-types = false
check-yield-types = false
require-return-section-when-returning-nothing = false
skip-checking-raises = true
skip-checking-short-docstrings = false
allow-init-docstring = true

[tool.pytest.ini_options]
addopts = [
    "--cov-branch",
    "--cov-fail-under=80",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov=prollm",
    "--strict-config",
    "--strict-markers",
]
asyncio_mode = "auto"
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
parallel = true
source = ["prollm"]

[tool.coverage.paths]
source = [
    "*/site-packages/prollm",
    "prollm",
]

[tool.coverage.report]
exclude_also = [
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
fail_under = 80
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
